# Path configurations
paths:
  data_dir: "scripts/Combined_Dataset_Experimentation"
  models_dir: "models"
  results_dir: "results"


# Feature configurations
features:
  core_contextual:
    - "YYYY_MM"
    - "Country"
    - "Iso3"
    - "Region"
    - "Crisis Id"
    - "Crisis"

  socio_economic:
    - "Empowerment"
    - "Bti - Democracy Status"
    - "Trust In Society"
    - "Ethnic Fractionalisation"
    - "Gender Inequality"
    - "Income Gini Coefficient"
    - "Corruption Perception"

  governance_indicators:
    - "Rule Of Law (Wgi)"
    - "Rule Of Law (Bti)"
    - "Rule Of Law"
    - "Freedom In The World"

  crisis_impact:
    - "Conflict Intensity"
    - "Total Killed In All Crisis"
    - "Safety And Security"
    - "People In Need"
    - "Buildings Damaged [Helper 8]"
    - "Buildings Damaged [Figure]"
    - "Buildings Damaged [Date]"
    - "Economic Losses [Helper 11]"
    - "Economic Losses [Figure]"
    - "Economic Losses [Date]"

  humanitarian_conditions:
    - "# Of People Facing Minimal Humanitarian Needs (Level 1)"
    - "# Of People Facing Stressed Humanitarian Conditions And Needs (Level 2)"
    - "# Of People Facing Moderate Humanitarian Conditions And Needs (Level 3)"
    - "# Of People Facing Severe Humanitarian Conditions And Needs (Level 4)"
    - "# Of People Facing Extreme Humanitarian Conditions And Needs (Level 5)"
    - "% Of People In None/Minimal Conditions - Level 1"
    - "% Of People In Stressed Conditions - Level 2"
    - "% Of People In Moderate Conditions - Level 3"
    - "% Of People Severe Conditions - Level 4"
    - "% Of People Extreme Conditions - Level 5"
    - "People Displaced"
    - "People Affected"

  access_constraints:
    - "Humanitarian Access"
    - "Access Of Humanitarian Actors To Affected Populations"
    - "Ongoing Insecurity/Hostilities Affecting Humanitarian Assistance"
    - "Physical And Security Constraints"
    - "Access Of People In Need To Aid"

# Target variables
targets:
  severity:
    - "Inform Severity Index"
    - "Inform Severity Category"
  probability:
    - "Concentration Of Conditions"
    - "Complexity Of The Crisis"
    - "Updated_Score"
  escalation:
    - "Trend (Last 3 Months)"
    - "Impact Of The Crisis"

# Model parameters
model_params:
  learning_rate: 0.001 
  
  prophet:
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10.0
    yearly_seasonality: true
    weekly_seasonality: false
    daily_seasonality: false
    
  lstm:
    units: 64
    dropout: 0.2
    recurrent_dropout: 0.1
    activation: "relu"
    optimizer: "adam"
    epochs: 100
    batch_size: 32
    
  catboost:
    iterations: 1000
    learning_rate: 0.03
    depth: 6
    l2_leaf_reg: 3
    random_seed: 42
    
  lightgbm:
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 5

# Training configurations
training:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  cv_folds: 5
  early_stopping_rounds: 50

# Evaluation metrics
evaluation:
  metrics:
    regression:
      - "rmse"
      - "mae"
      - "r2"
    classification:
      - "accuracy"
      - "f1_score"
      - "roc_auc"
    ordinal:
      - "ordinal_accuracy"
      - "mean_absolute_error"

# Uncertainty estimation
uncertainty:
  monte_carlo_iterations: 100
  confidence_level: 0.95
  dropout_rate: 0.1

# Visualization settings
visualization:
  style: "seaborn"
  figure_size: [12, 8]
  dpi: 300
  save_format: "png"
